<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر حساب هوشمند">
<title>دفتر حساب هوشمند مغازه</title>
<link rel="manifest" href="/manifest-daftar.json">
<link rel="icon" type="image/svg+xml" href="/icon-daftar.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-daftar-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-daftar-512.png">
<link rel="apple-touch-icon" href="/icon-daftar-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-secondary: #334155;
  --mute: #64748b;
  --line: #e2e8f0;
  --soft: #f1f5f9;
  --soft-hover: #e2e8f0;
  --brand: #3730a3;
  --brand2: #4f46e5;
  --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
  --brandsoft: #eef2ff;
  --brandborder: #c7d2fe;
  --side: #0f172a;
  --sideink: #cbd5e1;
  --side-active: #1e293b;
  --green: #059669; --greenbg: #ecfdf5; --greenline: #a7f3d0;
  --red: #e11d48; --redbg: #fff1f2; --redline: #fecdd3;
  --blue: #2563eb; --bluebg: #eff6ff; --blueline: #bfdbfe;
  --orange: #d97706; --orangebg: #fffbeb; --orangeline: #fde68a;
  --sh-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --sh: 0 3px 10px -2px rgba(15, 23, 42, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.04);
  --sh-lg: 0 16px 36px -6px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
  --r: 16px;
  --r-sm: 10px;
  --r-lg: 24px;
}
html.dark{
  --bg: #090d16;
  --card: #111827;
  --ink: #f8fafc;
  --ink-secondary: #cbd5e1;
  --mute: #94a3b8;
  --line: #1f2937;
  --soft: #172033;
  --soft-hover: #1e293b;
  --brand: #818cf8;
  --brand2: #6366f1;
  --brand-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  --brandsoft: #1e1b4b;
  --brandborder: #312e81;
  --side: #070a10;
  --sideink: #94a3b8;
  --side-active: #131b2e;
  --green: #34d399; --greenbg: rgba(5, 150, 105, 0.15); --greenline: rgba(5, 150, 105, 0.3);
  --red: #fb7185; --redbg: rgba(225, 29, 72, 0.15); --redline: rgba(225, 29, 72, 0.3);
  --blue: #60a5fa; --bluebg: rgba(37, 99, 235, 0.15); --blueline: rgba(37, 99, 235, 0.3);
  --orange: #fbbf24; --orangebg: rgba(217, 119, 6, 0.15); --orangeline: rgba(217, 119, 6, 0.3);
  --sh: 0 4px 16px rgba(0, 0, 0, 0.35);
  --sh-lg: 0 20px 45px rgba(0, 0, 0, 0.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
svg.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.mute{color:var(--mute)}.sm{font-size:12.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.c-red{color:var(--red)}.c-green{color:var(--green)}.c-blue{color:var(--blue)}.c-orange{color:var(--orange)}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}

/* ---------- صفحه ورود شیک ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 85% 15%,rgba(99,102,241,.35) 0,transparent 55%),
             radial-gradient(ellipse at 15% 85%,rgba(16,185,129,.25) 0,transparent 55%),
             linear-gradient(150deg,#0a0e24 0%,#151c48 50%,#1f1c50 100%);
  position:relative;overflow:hidden}
.login::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(99,102,241,.15);filter:blur(80px);top:-100px;right:-100px;pointer-events:none}
.login::after{content:'';position:absolute;width:350px;height:350px;border-radius:50%;background:rgba(16,185,129,.1);filter:blur(90px);bottom:-80px;left:-80px;pointer-events:none}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 28px;width:100%;max-width:420px;box-shadow:var(--sh-lg);position:relative;z-index:2;animation:pop .22s cubic-bezier(.16,1,.3,1)}
.login .logo{width:68px;height:68px;border-radius:22px;background:var(--brand-gradient);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 16px;box-shadow:0 10px 24px rgba(79,70,229,.35)}
.login h1{text-align:center;margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
.login p{text-align:center;margin:6px 0 18px;line-height:1.6}

/* فیلد رمز عبور با قابلیت نمایش و مخفی‌سازی */
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-left:42px}
.pw-wrap .toggle-pw{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mute);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px;transition:color .15s}
.pw-wrap .toggle-pw:hover{color:var(--ink)}

/* ---------- چیدمان نرم‌افزار ---------- */
#app{min-height:100%}
.side{position:fixed;top:0;bottom:0;right:0;width:248px;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;z-index:25;transition:transform .24s cubic-bezier(.16,1,.3,1);overflow-y:auto;border-left:1px solid rgba(255,255,255,.06)}
.side .brand{display:flex;align-items:center;gap:12px;padding:20px 18px;color:#fff;font-weight:800;font-size:16px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .brand i{width:40px;height:40px;border-radius:13px;background:var(--brand-gradient);display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:0 4px 12px rgba(79,70,229,.3);flex:none}
.side .brand small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.side nav{padding:10px 12px;flex:1}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:4px;cursor:pointer;color:var(--sideink);font-weight:500;transition:all .15s ease}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav a.on{background:var(--brand-gradient);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(79,70,229,.35)}
html.dark .side nav a.on{background:var(--brand-gradient);color:#fff}
.side nav .grp{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.45);padding:14px 14px 6px;letter-spacing:.3px}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.15)}
.main{margin-right:248px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:17px;font-weight:800;flex:0 1 auto;white-space:nowrap}
.gs{flex:1;max-width:480px;position:relative;margin-inline-start:auto}
.gs input{padding-inline-start:40px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh-sm);height:42px;font-size:13.5px}
.gs input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.gs .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.gs .res{position:absolute;top:48px;right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);max-height:72vh;overflow:auto;z-index:40;padding:8px}
.gs .res h4{margin:8px 12px 4px;font-size:12px;color:var(--mute);font-weight:700}
.gs .res a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;cursor:pointer;transition:background .12s}
.gs .res a:hover{background:var(--soft)}
.ibtn{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;transition:all .15s ease;box-shadow:var(--sh-sm)}
.ibtn:hover{background:var(--soft);border-color:var(--brandborder);transform:translateY(-1px)}
.ibtn:active{transform:translateY(0)}
.page{padding:20px;max-width:1200px;margin:0 auto;animation:fade .2s ease-out}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.menuBtn{display:none}
.bnav{display:none}
.scrim{display:none}
@media(max-width:940px){
  .side{transform:translateX(100%);width:280px}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(5,8,25,.6);backdrop-filter:blur(3px);z-index:22}
  .main{margin-right:0;padding-bottom:82px}
  .menuBtn{display:grid}
  .bnav{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--mute);cursor:pointer;transition:all .15s}
  .bnav a svg.ic{width:22px;height:22px}
  .bnav a.on{color:var(--brand2);font-weight:800}
  .topbar h1{font-size:15px}
  .page{padding:14px}
}

/* ---------- کارت‌ها، ابزارها و دکمه‌ها ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:16px;transition:border-color .15s ease}
.card>h3,.ch{margin:0 0 12px;font-size:15.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:940px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2{grid-template-columns:1fr}}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:default;transition:all .18s ease}
.stat.link{cursor:pointer}
.stat.link:hover{border-color:var(--brand2);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.stat .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:8px;font-size:18px}
.stat .v{font-size:21px;font-weight:800;line-height:1.3;letter-spacing:-.3px}
.stat .v small{font-size:12.5px;font-weight:600;opacity:.8;margin-inline-start:4px}
.stat .l{font-size:12.5px;color:var(--mute);margin-top:3px}
.ico.red{background:var(--redbg);color:var(--red);border:1px solid var(--redline)}
.ico.green{background:var(--greenbg);color:var(--green);border:1px solid var(--greenline)}
.ico.blue{background:var(--bluebg);color:var(--blue);border:1px solid var(--blueline)}
.ico.orange{background:var(--orangebg);color:var(--orange);border:1px solid var(--orangeline)}
.ico.brand{background:var(--brandsoft);color:var(--brand2);border:1px solid var(--brandborder)}

.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;font-size:13.5px;background:var(--brand-gradient);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .14s ease;box-shadow:0 2px 6px rgba(79,70,229,.25)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.35)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sec:hover{background:var(--soft-hover);filter:none}
.btn.green{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 2px 6px rgba(16,185,129,.25)}
.btn.red{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 2px 6px rgba(244,63,94,.25)}
.btn.orange{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 2px 6px rgba(245,158,11,.25)}
html.dark .btn{color:#fff}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:8px}.btn.s{padding:7px 13px;font-size:13px;border-radius:10px}.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f>label{font-size:12.5px;font-weight:600;color:var(--mute)}
input,select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[type=checkbox],input[type=radio]{width:auto;cursor:pointer}
input.err,select.err{border-color:var(--red)}
.ferr{color:var(--red);font-size:12px;font-weight:600}
.fg{display:grid;gap:0 12px;grid-template-columns:repeat(2,1fr)}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
.jd{display:grid;grid-template-columns:72px 1fr 94px;gap:6px}
.jd select{padding:10px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .14s ease}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(79,70,229,.25)}
html.dark .chip.on{color:#fff}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.red{background:var(--redbg);color:var(--red);border:1px solid var(--redline)}
.tag.green{background:var(--greenbg);color:var(--green);border:1px solid var(--greenline)}
.tag.blue{background:var(--bluebg);color:var(--blue);border:1px solid var(--blueline)}
.tag.orange{background:var(--orangebg);color:var(--orange);border:1px solid var(--orangeline)}
.av{flex:none;width:40px;height:40px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:26px}

/* ---------- دکمه‌های اقدام سریع (Quick Action) ---------- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;box-shadow:var(--sh);transition:all .18s ease}
.qa button:hover{border-color:var(--brand2);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.qa .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}

/* ---------- جدول شیک ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--sh-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--mute);font-weight:700;font-size:12.5px;position:sticky;top:0;z-index:2}
th[data-sort]{cursor:pointer;user-select:none}
th.on{color:var(--brand2)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s ease}
tbody tr.click:hover td{background:var(--soft)}
td.wrap{white-space:normal;min-width:160px}
tfoot td{background:var(--soft);font-weight:800}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:160px}
.toolbar select{width:auto}
.empty{text-align:center;padding:36px 14px;color:var(--mute)}
.empty .big{font-size:48px;display:block;margin-bottom:6px}
.empty h3{margin:4px 0;color:var(--ink);font-size:17px;font-weight:700}

/* ---------- مودال و اعلان‌ها ---------- */
.modal{position:fixed;inset:0;background:rgba(6,9,28,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px;padding:20px;animation:pop .2s cubic-bezier(.16,1,.3,1);box-shadow:var(--sh-lg);border:1px solid var(--line)}
.sheet.wide{max-width:860px}
@keyframes pop{from{transform:translateY(18px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
@media(max-width:620px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:96vh;padding:18px}}
.sheet h2{margin:0 0 14px;font-size:17.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{pointer-events:auto;padding:12px 16px;border-radius:14px;color:#fff;font-size:14px;font-weight:600;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:center;animation:pop .18s ease-out}
.toast.ok{background:#059669}.toast.err{background:#e11d48}.toast.warn{background:#d97706}.toast.info{background:#2563eb}
.toast button{margin-inline-start:auto;background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:700}
.banner{border-radius:14px;padding:11px 15px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid transparent}
.banner.warn{background:var(--orangebg);color:var(--orange);border-color:var(--orangeline)}
.banner.red{background:var(--redbg);color:var(--red);border-color:var(--redline)}
.banner.info{background:var(--bluebg);color:var(--blue);border-color:var(--blueline)}
.banner.green{background:var(--greenbg);color:var(--green);border-color:var(--greenline)}
.banner>span{flex:1;min-width:180px}

/* ---------- کارت پیامک آزمایشی شبیه‌سازی‌شده ---------- */
.sms-sim-box{background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(16,185,129,.08));border:1.5px dashed var(--brand2);border-radius:16px;padding:14px;margin-bottom:14px}
.sms-sim-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--brand2)}
.sms-code-badge{font-size:24px;font-weight:900;letter-spacing:6px;direction:ltr;text-align:center;color:var(--brand2);margin:8px 0;background:var(--card);border-radius:12px;padding:8px;border:1px solid var(--line)}

/* ---------- بخش‌های ویژه ---------- */
.cust-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cust-head .info{flex:1;min-width:200px}
.cust-head h2{margin:0;font-size:20px;font-weight:800}
.meter{height:10px;border-radius:10px;background:var(--soft);overflow:hidden}

<script>
(function(){
'use strict';
/* =====================================================================
   هسته‌ی حسابداری — بدون وابستگی به DOM (قابل آزمون با Node)
   همه‌ی مبالغ به‌صورت «ریال» و «عدد صحیح» ذخیره می‌شوند تا خطای گرد کردن نداشته باشیم.
   ===================================================================== */
var DBKEY="daftar_hooshmand_v3",OLDKEY="daftar_moshtari_v1";
var db=null,cur=null,rev=0,authBy="";
var LS=(typeof localStorage!=="undefined")?localStorage:null;

/* ---------- ابزارهای عددی و متنی ---------- */
function d2e(s){return String(s==null?"":s).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
function num(s){s=d2e(s).replace(/[,٬،\s]/g,"").replace(/٫/g,".");var n=parseFloat(s);return isNaN(n)||!isFinite(n)?0:n}
function toFa(s){return String(s).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".charAt(d)})}
function pad(n,w){var s=String(n);w=w||2;while(s.length<w)s="0"+s;return s}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function normPhone(p){var d=d2e(p).replace(/\D/g,"");if(d.indexOf("0098")===0)d=d.slice(4);else if(d.indexOf("98")===0&&d.length>=12)d=d.slice(2);if(d.charAt(0)!=="0"&&d.length===10)d="0"+d;return d}

/* ---------- SHA-256 همزمان (برای رمز کاربران) ---------- */
var _K=null,_H0=null;
function _primes(n){var p=[],i=2;while(p.length<n){var ok=true;for(var j=0;j<p.length;j++){if(p[j]*p[j]>i)break;if(i%p[j]===0){ok=false;break}}if(ok)p.push(i);i++}return p}
function sha256(msg){
  if(!_K){var pr=_primes(64);_K=pr.map(function(p){var c=Math.cbrt(p);return Math.floor((c-Math.floor(c))*4294967296)>>>0});
    _H0=pr.slice(0,8).map(function(p){var c=Math.sqrt(p);return Math.floor((c-Math.floor(c))*4294967296)>>>0})}
  var bytes=Array.prototype.slice.call(new TextEncoder().encode(msg));
  var l=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  var hi=Math.floor(l/4294967296),lo=l>>>0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  var H=_H0.slice(),W=new Array(64);
  function rr(x,n){return (x>>>n)|(x<<(32-n))}
  for(var o=0;o<bytes.length;o+=64){
    for(var i=0;i<16;i++)W[i]=((bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3])>>>0;
    for(i=16;i<64;i++){var s0=rr(W[i-15],7)^rr(W[i-15],18)^(W[i-15]>>>3),s1=rr(W[i-2],17)^rr(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0}
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+_K[i]+W[i])>>>0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
  return H.map(function(x){return pad(x.toString(16),8)}).join("")}
function hashPw(pw,salt){var h=salt+"|"+pw;for(var i=0;i<1500;i++)h=sha256(h+salt);return h}

/* ---------- تاریخ و ساعت (شمسی، با منطقه‌ی زمانی) ---------- */
var TZ="Asia/Tehran",_jf=null,_gf=null;
var JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function setTz(tz){TZ=tz||"Asia/Tehran";_jf=null;_gf=null}
function _jfm(){return _jf||(_jf=new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric"}))}
function _gfm(){return _gf||(_gf=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}))}
function jp(ts){var o={y:0,m:1,d:1};_jfm().formatToParts(new Date(ts)).forEach(function(p){if(p.type==="year")o.y=parseInt(p.value,10);else if(p.type==="month")o.m=parseInt(p.value,10);else if(p.type==="day")o.d=parseInt(p.value,10)});return o}
function gp(ts){var o={y:0,m:1,d:1};_gfm().formatToParts(new Date(ts)).forEach(function(p){if(p.type==="year")o.y=parseInt(p.value,10);else if(p.type==="month")o.m=parseInt(p.value,10);else if(p.type==="day")o.d=parseInt(p.value,10)});return o}
function dayNum(ts){var g=gp(ts);return Math.round(Date.UTC(g.y,g.m-1,g.d)/864e5)}
function dkey(ts){var p=jp(ts);return p.y*10000+p.m*100+p.d}
function dstr(ts){var p=jp(ts);return toFa(p.d)+" "+JM[p.m-1]+" "+toFa(p.y)}
function dshort(ts){var p=jp(ts);return toFa(p.y+"/"+pad(p.m)+"/"+pad(p.d))}
function tstr(ts){return new Date(ts).toLocaleTimeString("fa-IR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"})}
function dtstr(ts){return dshort(ts)+" "+tstr(ts)}
function j2ts(jy,jm,jd){
  var target=jy*10000+jm*100+jd;
  var days=(jm<=6?(jm-1)*31:186+(jm-7)*30)+jd-1;
  var t=Date.UTC(jy+621,2,21,9,0,0)+days*864e5;
  for(var i=0;i<45;i++){var p=jp(t),k=p.y*10000+p.m*100+p.d;if(k===target)return t;t+=(k<target?1:-1)*864e5}
  return jd>1?j2ts(jy,jm,jd-1):t}
function jdToTs(y,m,d){var n=Date.now(),p=jp(n);if(p.y===y&&p.m===m&&p.d===d)return n;return j2ts(y,m,d)}
function monthDays(y,m){if(m<=6)return 31;if(m<=11)return 30;return jp(j2ts(y+1,1,1)-864e5).d}
function weekIdx(ts){return Math.floor((dayNum(ts)-2)/7)}   /* هفته از شنبه شروع می‌شود */
function daysBetween(fromTs,toTs){return dayNum(toTs)-dayNum(fromTs)}

/* ---------- پول ---------- */
function unit(){return db&&db.settings.cur==="rial"?1:10}
function cuName(){return db&&db.settings.cur==="rial"?"ریال":"تومان"}
function toBase(n){return Math.round(n*unit())}
function money(r){var v=r/unit(),neg=v<0;v=Math.abs(v);var s=(Math.round(v*10)/10).toLocaleString("fa-IR",{maximumFractionDigits:1});return (neg?"−":"")+s}
function parseMoney(s){return toBase(num(s))}
function fq(n){return (Math.round(n*100)/100).toLocaleString("fa-IR")}
function fa(n){return Number(n).toLocaleString("fa-IR",{useGrouping:false})}
function fmtC(r){var n=Math.abs(r/unit());var s=n>=1e9?fq(n/1e9)+" میلیارد":n>=1e6?fq(n/1e6)+" میلیون":n>=1e3?fq(n/1e3)+" هزار":fq(n);return (r<0?"−":"")+s}

/* ---------- پایگاه داده ---------- */
function defaults(){return{v:3,
  settings:{shop:"",phone:"",address:"",logo:"",cur:"toman",tz:"Asia/Tehran",footer:"با تشکر از خرید شما",riskDebt:50000000,riskDays:30,nearPct:80,nearDays:3,
    remind:"سلام {name} عزیز 🌹\nمانده بدهی شما در {shop} مبلغ {amount} {cur} است.\n{due}لطفاً در اولین فرصت تسویه فرمایید. ممنون از لطفتان."},
  users:[],customers:[],invoices:[],payments:[],txs:[],allocs:[],followups:[],audit:[],cashCounts:{},
  seq:{inv:0,rec:0,doc:0,cust:0,txn:0},meta:{lastBackup:0,created:Date.now(),migrated:false}}}
function ensure(){var d=defaults();
  ["settings","seq","meta"].forEach(function(k){db[k]=Object.assign({},d[k],db[k]||{})});
  ["users","customers","invoices","payments","txs","allocs","followups","audit"].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[]});
  if(!db.cashCounts||typeof db.cashCounts!=="object")db.cashCounts={};db.v=3}
function touch(){rev++}
var lastSaveError=false;
function save(){touch();try{if(LS)LS.setItem(DBKEY,JSON.stringify(db));lastSaveError=false;return true}catch(e){lastSaveError=true;return false}}
function load(){
  var s=null;try{s=LS&&LS.getItem(DBKEY)}catch(e){}
  db=null;
  if(s){try{db=JSON.parse(s);ensure()}catch(e){db=null}}
  if(!db){db=defaults();var old=null;try{old=LS&&LS.getItem(OLDKEY)}catch(e){}
    if(old){try{migrateV1(JSON.parse(old));db.meta.migrated=true}catch(e){db=defaults()}}}
  setTz(db.settings.tz);touch()}
/* هر عملیات مالی «اتمی» است: اگر خطا بخورد، همه‌ی تغییرات برگردانده می‌شود */
function atomic(fn){var snap=JSON.stringify(db);try{var r=fn();if(!save())throw new Error("SAVE");return r}catch(e){db=JSON.parse(snap);touch();throw e}}
function audit(action,entity,eid,detail){
  db.audit.push({id:uid(),ts:Date.now(),uid:cur?cur.id:"",user:cur?cur.name:"سیستم",action:action,entity:entity||"",eid:eid||"",detail:detail||"",auth:authBy||""});
  if(db.audit.length>8000)db.audit.splice(0,db.audit.length-8000)}
function nextNo(kind,prefix,w){db.seq[kind]=(db.seq[kind]||0)+1;return prefix+"-"+pad(db.seq[kind],w)}

/* ---------- ایندکس (برای سرعت و سازگاری محاسبات) ---------- */
var _ix=null,_ixRev=-1;
function IX(){
  if(_ix&&_ixRev===rev)return _ix;
  var x={cust:{},tx:{},inv:{},pay:{},txc:{},bal:{},alloc:{},invc:{},lastSale:{},lastPay:{},sales:{},paid:{},lastFu:{}};
  db.customers.forEach(function(c){x.cust[c.id]=c;x.txc[c.id]=[];x.bal[c.id]=0;x.invc[c.id]=[];x.sales[c.id]=0;x.paid[c.id]=0;x.lastSale[c.id]=0;x.lastPay[c.id]=0});
  db.invoices.forEach(function(i){x.inv[i.id]=i;(x.invc[i.cid]||(x.invc[i.cid]=[])).push(i)});
  db.payments.forEach(function(p){x.pay[p.id]=p});
  db.txs.forEach(function(t){x.tx[t.id]=t;if(!x.txc[t.cid])return;x.txc[t.cid].push(t);x.bal[t.cid]+=t.debit-t.credit;
    if(t.status==="active"){
      if(t.type==="sale"){x.sales[t.cid]+=t.debit;if(t.ts>x.lastSale[t.cid])x.lastSale[t.cid]=t.ts}
      else if(t.type==="payment"){x.paid[t.cid]+=t.credit;if(t.ts>x.lastPay[t.cid])x.lastPay[t.cid]=t.ts}}});
  Object.keys(x.txc).forEach(function(k){x.txc[k].sort(function(a,b){return a.ts-b.ts||a.n-b.n})});
  db.allocs.forEach(function(a){var t=x.tx[a.tx],i=x.inv[a.inv];if(t&&t.status!=="reversed"&&i&&i.status==="active")x.alloc[a.inv]=(x.alloc[a.inv]||0)+a.amt});
  db.followups.forEach(function(f){if(!x.lastFu[f.cid]||f.ts>x.lastFu[f.cid].ts)x.lastFu[f.cid]=f});
  _ix=x;_ixRev=rev;return x}
function getC(id){return IX().cust[id]||null}
function getInv(id){return IX().inv[id]||null}
function getPay(id){return IX().pay[id]||null}
function getTx(id){return IX().tx[id]||null}
function bal(cid){return IX().bal[cid]||0}
function invPaid(i){return i.status==="active"?(IX().alloc[i.id]||0):0}
function invRem(i){return i.status==="active"?i.total-invPaid(i):0}
function invState(i){if(i.status==="draft")return"draft";if(i.status==="void")return"void";var r=invRem(i);if(r<=0)return"paid";return invPaid(i)>0?"partial":"open"}
function invLate(i,now){if(i.status!=="active"||!i.due||invRem(i)<=0)return 0;var d=daysBetween(i.due,now||Date.now());return d>0?d:0}
function payUnalloc(p){var x=IX();if(p.status!=="active")return 0;var t=x.tx[p.txId],s=0;db.allocs.forEach(function(a){if(a.tx===p.txId){var i=x.inv[a.inv];if(i&&i.status==="active")s+=a.amt}});return p.amount-s}
function openInvoices(cid){return IX().invc[cid].filter(function(i){return i.status==="active"&&invRem(i)>0}).sort(function(a,b){return a.ts-b.ts})}
function custStats(cid,now){
  now=now||Date.now();var x=IX(),c=x.cust[cid],b=x.bal[cid]||0,late=0,lateAmt=0,openN=0,openAmt=0;
  (x.invc[cid]||[]).forEach(function(i){if(i.status!=="active")return;var r=invRem(i);if(r>0){openN++;openAmt+=r;var d=invLate(i,now);if(d>0){lateAmt+=r;if(d>late)late=d}}});
  return{bal:b,limit:c?c.limit:0,usedPct:c&&c.limit>0?Math.max(0,Math.round(b/c.limit*100)):0,sales:x.sales[cid]||0,paid:x.paid[cid]||0,
    lastSale:x.lastSale[cid]||0,lastPay:x.lastPay[cid]||0,lateDays:late,lateAmt:lateAmt,openN:openN,openAmt:openAmt,lastFu:x.lastFu[cid]||null}}
function totalDebt(){var s=0,x=IX();Object.keys(x.bal).forEach(function(k){if(x.bal[k]>0)s+=x.bal[k]});return s}
function totalCredit(){var s=0,x=IX();Object.keys(x.bal).forEach(function(k){if(x.bal[k]<0)s-=x.bal[k]});return s}
function ledgerTotal(){var s=0;db.txs.forEach(function(t){s+=t.debit-t.credit});return s}
function bucketOf(days){return days<=0?"notdue":days<=7?"d7":days<=30?"d30":days<=60?"d60":days<=90?"d90":"d90p"}
var BUCKETS=[["notdue","هنوز سررسید نشده / بدون سررسید"],["d7","۱ تا ۷ روز تأخیر"],["d30","۸ تا ۳۰ روز"],["d60","۳۱ تا ۶۰ روز"],["d90","۶۱ تا ۹۰ روز"],["d90p","بیش از ۹۰ روز"]];
function aging(now){
  now=now||Date.now();var out={};BUCKETS.forEach(function(b){out[b[0]]={amt:0,n:0,list:[]}});
  db.invoices.forEach(function(i){if(i.status!=="active")return;var r=invRem(i);if(r<=0)return;var k=bucketOf(invLate(i,now));out[k].amt+=r;out[k].n++;out[k].list.push(i)});
  return out}

/* ---------- مشتری ---------- */
function findDup(name,phone,exId){
  var np=normPhone(phone),nn=String(name||"").trim().replace(/\s+/g," ");
  for(var i=0;i<db.customers.length;i++){var c=db.customers[i];if(c.id===exId)continue;
    if(np&&(normPhone(c.phone)===np||(c.phone2&&normPhone(c.phone2)===np)))return c;
    if(nn&&c.name.trim().replace(/\s+/g," ")===nn)return c}
  return null}
function addCustomer(o,opt){
  opt=opt||{};var name=String(o.name||"").trim();if(!name)throw new Error("نام مشتری را بنویسید");
  var lim=Math.max(0,Math.round(o.limit||0)),op=Math.max(0,Math.round(o.opening||0));
  var d=findDup(name,o.phone);if(d&&!opt.force)throw new Error("DUP:"+d.id);
  return atomic(function(){
    var c={id:uid(),code:nextNo("cust","C",4),name:name,phone:String(o.phone||"").trim(),phone2:String(o.phone2||"").trim(),address:String(o.address||"").trim(),
      avatar:o.avatar||"",created:Date.now(),limit:lim,note:String(o.note||"").trim(),status:o.status||"active"};
    db.customers.push(c);touch();
    if(op>0)_mkTx({cid:c.id,ts:Date.now(),type:"opening",debit:op,credit:0,desc:"مانده افتتاحیه (از دفتر قبلی)"});
    audit("create","customer",c.id,"ثبت مشتری "+name+(op>0?" با مانده افتتاحیه":""));return c})}
function updateCustomer(id,o,opt){
  opt=opt||{};var c=getC(id);if(!c)throw new Error("مشتری پیدا نشد");
  var name=String(o.name||"").trim();if(!name)throw new Error("نام مشتری را بنویسید");
  var d=findDup(name,o.phone,id);if(d&&!opt.force)throw new Error("DUP:"+d.id);
  return atomic(function(){
    var before=c.name+"/"+c.status+"/"+c.limit;
    c.name=name;c.phone=String(o.phone||"").trim();c.phone2=String(o.phone2||"").trim();c.address=String(o.address||"").trim();
    c.limit=Math.max(0,Math.round(o.limit||0));c.note=String(o.note||"").trim();c.status=o.status||c.status;if(o.avatar!==undefined)c.avatar=o.avatar;
    touch();audit("update","customer",id,"ویرایش مشتری (قبل: "+before+")");return c})}

/* ---------- سند مالی ---------- */
function _mkTx(o){
  var t={id:uid(),n:++db.seq.txn,no:nextNo("doc","D",6),cid:o.cid,ts:o.ts||Date.now(),type:o.type,debit:o.debit||0,credit:o.credit||0,desc:o.desc||"",due:o.due||null,
    status:"active",ref:o.ref||{},method:o.method||"",user:cur?cur.name:"سیستم",reason:o.reason||""};
  db.txs.push(t);touch();return t}
function _mkSale(o){
  var inv={id:uid(),no:o.no||nextNo("inv","F",5),cid:o.cid,ts:o.ts||Date.now(),due:o.due||null,items:o.items,sub:o.sub,disc:o.disc||0,total:o.total,status:"active",note:o.note||"",user:cur?cur.name:"سیستم",txId:""};
  db.invoices.push(inv);
  var t=_mkTx({cid:o.cid,ts:inv.ts,type:"sale",debit:inv.total,desc:"فاکتور فروش نسیه "+inv.no,due:inv.due,ref:{inv:inv.id}});
  inv.txId=t.id;touch();return inv}
function _mkPay(o){
  var p={id:uid(),no:nextNo("rec","R",5),cid:o.cid,ts:o.ts||Date.now(),amount:o.amount,method:o.method||"cash",ref:o.ref||"",note:o.note||"",receiver:o.receiver||(cur?cur.name:""),
    status:"active",user:cur?cur.name:"سیستم",key:o.key||"",atSale:o.atSale||"",txId:""};
  db.payments.push(p);
  var t=_mkTx({cid:o.cid,ts:p.ts,type:"payment",credit:p.amount,method:p.method,desc:o.desc||("دریافت وجه — رسید "+p.no),ref:{pay:p.id}});
  p.txId=t.id;touch();
  (o.allocs||[]).forEach(function(a){if(a.amt>0)db.allocs.push({id:uid(),inv:a.inv,tx:t.id,amt:a.amt})});touch();return p}
function _fifo(cid,amount){
  var left=amount,out=[];openInvoices(cid).forEach(function(i){if(left<=0)return;var r=invRem(i),a=Math.min(r,left);if(a>0){out.push({inv:i.id,amt:a});left-=a}});return out}
function autoAlloc(cid,amount){return _fifo(cid,amount)}

function calcInvoice(items,disc){
  var sub=0;items.forEach(function(i){sub+=Math.round(i.q*i.p)});
  disc=Math.max(0,Math.round(disc||0));return{sub:sub,disc:disc,total:sub-disc}}
function _cleanItems(items){
  var out=[];(items||[]).forEach(function(i){var n=String(i.n||"").trim(),q=Number(i.q),p=Math.round(Number(i.p));
    if(!n&&!(p>0))return;if(!n)throw new Error("نام کالا یا شرح را بنویسید");
    if(!(q>0))throw new Error("تعداد باید بزرگ‌تر از صفر باشد");if(!(p>=0))throw new Error("قیمت نامعتبر است");
    out.push({n:n,q:q,u:String(i.u||"").trim(),p:p})});
  if(!out.length)throw new Error("حداقل یک قلم کالا یا خدمات وارد کنید");return out}

/* o: {cid,ts,due,items,disc,paid,method,ref,note,draft,invId(ویرایش پیش‌نویس),overrideBlocked,overrideLimit} */
function createInvoice(o){
  var c=getC(o.cid);if(!c)throw new Error("مشتری را انتخاب کنید");
  var items=_cleanItems(o.items),cc=calcInvoice(items,o.disc);
  if(cc.disc>cc.sub)throw new Error("تخفیف از جمع اقلام بیشتر است");
  var paid=Math.max(0,Math.round(o.paid||0));if(paid>cc.total)throw new Error("مبلغ پرداخت‌شده از مبلغ نهایی بیشتر است");
  if(o.due&&o.ts&&dayNum(o.due)<dayNum(o.ts))throw new Error("تاریخ سررسید نمی‌تواند قبل از تاریخ فروش باشد");
  if(!o.draft){
    if(c.status==="blocked"&&!o.overrideBlocked)throw new Error("BLOCKED");
    if(c.status==="inactive"&&!o.overrideBlocked)throw new Error("INACTIVE");
    var after=bal(c.id)+cc.total-paid;if(c.limit>0&&after>c.limit&&!o.overrideLimit)throw new Error("LIMIT:"+after)}
  return atomic(function(){
    if(o.draft){
      var dr=o.invId?getInv(o.invId):null;
      if(dr&&dr.status!=="draft")throw new Error("فقط پیش‌نویس قابل ویرایش است");
      if(!dr){dr={id:uid(),no:"PRE-"+pad(db.invoices.filter(function(i){return i.status==="draft"}).length+1,3),cid:c.id,status:"draft"};db.invoices.push(dr)}
      Object.assign(dr,{cid:c.id,ts:o.ts||Date.now(),due:o.due||null,items:items,sub:cc.sub,disc:cc.disc,total:cc.total,note:o.note||"",user:cur?cur.name:"سیستم",paidAtSale:paid,txId:""});
      touch();audit("draft","invoice",dr.id,"ذخیره پیش‌نویس فاکتور برای "+c.name);return dr}
    if(o.invId){var d2=getInv(o.invId);if(d2&&d2.status==="draft")db.invoices.splice(db.invoices.indexOf(d2),1);touch()}
    var inv=_mkSale({cid:c.id,ts:o.ts||Date.now(),due:o.due||null,items:items,sub:cc.sub,disc:cc.disc,total:cc.total,note:o.note});
    if(paid>0)_mkPay({cid:c.id,ts:inv.ts+1,amount:paid,method:o.method||"cash",ref:o.ref,note:"پرداخت هنگام فروش "+inv.no,atSale:inv.id,allocs:[{inv:inv.id,amt:paid}]});
    audit("create","invoice",inv.id,"ثبت فاکتور "+inv.no+" برای "+c.name+" — مبلغ "+money(inv.total)+(paid>0?" (پرداخت‌شده "+money(paid)+")":""));return inv})}
function deleteDraft(id){var i=getInv(id);if(!i||i.status!=="draft")throw new Error("پیش‌نویس پیدا نشد");
  return atomic(function(){db.invoices.splice(db.invoices.indexOf(i),1);touch();audit("delete","invoice",id,"حذف پیش‌نویس فاکتور")})}

/* o: {cid,ts,amount,method,ref,note,receiver,allocs:[{inv,amt}],key,confirmOver} */
function createPayment(o){
  var c=getC(o.cid);if(!c)throw new Error("مشتری را انتخاب کنید");
  var amount=Math.round(o.amount||0);if(!(amount>0))throw new Error("مبلغ دریافتی باید بزرگ‌تر از صفر باشد");
  if(o.key&&db.payments.some(function(p){return p.key===o.key}))throw new Error("DUPKEY");
  var allocs=(o.allocs||[]).filter(function(a){return a.amt>0}),sum=0,seen={};
  allocs.forEach(function(a){var i=getInv(a.inv);if(!i||i.cid!==c.id||i.status!=="active")throw new Error("فاکتور تخصیص‌داده‌شده نامعتبر است");
    if(seen[a.inv])throw new Error("یک فاکتور دوبار تخصیص داده شده");seen[a.inv]=1;
    if(a.amt>invRem(i))throw new Error("تخصیص برای فاکتور "+i.no+" از مانده‌ی آن بیشتر است");sum+=a.amt});
  if(sum>amount)throw new Error("جمع تخصیص‌ها از مبلغ دریافتی بیشتر است");
  var after=bal(c.id)-amount;if(after<0&&!o.confirmOver)throw new Error("OVER:"+(-after));
  return atomic(function(){
    var p=_mkPay({cid:c.id,ts:o.ts||Date.now(),amount:amount,method:o.method||"cash",ref:o.ref,note:o.note,receiver:o.receiver,key:o.key,allocs:allocs});
    audit("create","payment",p.id,"ثبت دریافت "+p.no+" از "+c.name+" — "+money(amount)+" ("+({cash:"نقد",card:"کارت‌خوان",transfer:"انتقال بانکی",other:"سایر"}[p.method]||p.method)+")"+(after<0?" — مبلغ اضافی به‌عنوان اعتبار مشتری":""));return p})}
function similarPayment(cid,amount,method,withinMs){
  var now=Date.now();return db.payments.some(function(p){return p.cid===cid&&p.status==="active"&&p.amount===amount&&p.method===method&&now-p.ts<(withinMs||120000)})}

/* o: {cid,ts,amount,inv,desc,type:'return'|'discount'} */
function createCredit(o){
  var c=getC(o.cid);if(!c)throw new Error("مشتری را انتخاب کنید");
  var amount=Math.round(o.amount||0);if(!(amount>0))throw new Error("مبلغ باید بزرگ‌تر از صفر باشد");
  var desc=String(o.desc||"").trim();if(!desc)throw new Error("توضیح سند الزامی است");
  var type=o.type==="discount"?"discount":"return",inv=o.inv?getInv(o.inv):null;
  if(inv&&(inv.cid!==c.id||inv.status!=="active"))throw new Error("فاکتور نامعتبر است");
  return atomic(function(){
    var t=_mkTx({cid:c.id,ts:o.ts||Date.now(),type:type,credit:amount,desc:(type==="return"?"برگشت کالا — ":"تخفیف — ")+desc,ref:inv?{inv:inv.id}:{}});
    if(inv){var a=Math.min(amount,invRem(inv));if(a>0)db.allocs.push({id:uid(),inv:inv.id,tx:t.id,amt:a})}
    touch();audit("create",type,t.id,(type==="return"?"ثبت برگشت کالا ":"ثبت تخفیف ")+money(amount)+" برای "+c.name+" — "+desc);return t})}
/* o: {cid,ts,amount,dir:'debit'|'credit',reason} */
function createAdjust(o){
  var c=getC(o.cid);if(!c)throw new Error("مشتری را انتخاب کنید");
  var amount=Math.round(o.amount||0);if(!(amount>0))throw new Error("مبلغ باید بزرگ‌تر از صفر باشد");
  var reason=String(o.reason||"").trim();if(!reason)throw new Error("دلیل اصلاح الزامی است");
  var dir=o.dir==="credit"?"credit":"debit";
  return atomic(function(){
    var t=_mkTx({cid:c.id,ts:o.ts||Date.now(),type:"adjust",debit:dir==="debit"?amount:0,credit:dir==="credit"?amount:0,desc:"اصلاح حساب — "+reason,reason:reason});
    audit("create","adjust",t.id,"اصلاح حساب "+c.name+" ("+(dir==="debit"?"بدهکار":"بستانکار")+" "+money(amount)+") — "+reason);return t})}

/* ابطال = ثبت سند معکوس (سند اصلی هرگز حذف نمی‌شود) */
function reverseTx(txId,reason){
  var t=getTx(txId);if(!t)throw new Error("سند پیدا نشد");
  if(t.status!=="active")throw new Error("این سند قبلاً ابطال شده یا خودش سند معکوس است");
  reason=String(reason||"").trim();if(!reason)throw new Error("دلیل ابطال الزامی است");
  return atomic(function(){
    t.status="reversed";t.reversedAt=Date.now();t.reverseReason=reason;
    var r=_mkTx({cid:t.cid,ts:Date.now(),type:"reversal",debit:t.credit,credit:t.debit,desc:"سند معکوس "+t.no+" — "+reason,ref:{tx:t.id},reason:reason});
    r.status="reversal";t.reversedBy=r.id;
    if(t.ref&&t.ref.inv&&t.type==="sale"){var i=getInv(t.ref.inv);if(i)i.status="void"}
    if(t.ref&&t.ref.pay){var p=getPay(t.ref.pay);if(p)p.status="void"}
    touch();audit("reverse",t.type,t.id,"ابطال سند "+t.no+" ("+money(t.debit||t.credit)+") — "+reason);return r})}
function voidInvoice(id,reason){var i=getInv(id);if(!i)throw new Error("فاکتور پیدا نشد");if(i.status==="draft")return deleteDraft(id);if(i.status!=="active")throw new Error("فاکتور قبلاً ابطال شده");return reverseTx(i.txId,reason)}
function voidPayment(id,reason){var p=getPay(id);if(!p)throw new Error("رسید پیدا نشد");if(p.status!=="active")throw new Error("رسید قبلاً ابطال شده");return reverseTx(p.txId,reason)}

/* ---------- دفتر حساب ---------- */
function ledgerRows(cid,fromDay,toDay){
  var x=IX(),rows=[],run=0,before=0;
  (x.txc[cid]||[]).forEach(function(t){
    var dn=dayNum(t.ts);run+=t.debit-t.credit;
    if(fromDay!=null&&dn<fromDay){before=run;return}
    if(toDay!=null&&dn>toDay)return;
    rows.push({t:t,run:run,prev:run-(t.debit-t.credit)})});
  return{rows:rows,before:before}}

function remindText(c,now){

  return s.remind.replace(/\{name\}/g,c.name).replace(/\{amount\}/g,money(Math.max(0,st.bal))).replace(/\{cur\}/g,cuName()).replace(/\{shop\}/g,s.shop||"فروشگاه ما").replace(/\{due\}/g,dueTxt)}

var PERMS={admin:{all:1},cashier:{cust:1,inv:1,pay:1,follow:1,count:1,import:1},viewer:{}};
function can(p){return !!cur&&(cur.role==="admin"||!!(PERMS[cur.role]&&PERMS[cur.role][p]))}
function addUser(o){
  var un=String(o.username||"").trim().toLowerCase(),pw=String(o.pw||"");
  if(!String(o.name||"").trim())throw new Error("نام کاربر را بنویسید");if(!/^[a-z0-9_.]{3,20}$/.test(un))throw new Error("نام کاربری: ۳ تا ۲۰ حرف انگلیسی، عدد، نقطه یا _");
  if(pw.length<4)throw new Error("رمز حداقل ۴ کاراکتر باشد");if(db.users.some(function(u){return u.username===un}))throw new Error("این نام کاربری قبلاً ثبت شده");
  if(["admin","cashier","viewer"].indexOf(o.role)<0)throw new Error("نقش نامعتبر است");
  return atomic(function(){var salt=uid(),u={id:uid(),name:String(o.name).trim(),username:un,salt:salt,hash:hashPw(pw,salt),role:o.role,active:true,created:Date.now()};
    db.users.push(u);touch();audit("create","user",u.id,"ایجاد کاربر "+u.name+" ("+o.role+")");return u})}
function updateUser(id,o){
  var u=db.users.filter(function(x){return x.id===id})[0];if(!u)throw new Error("کاربر پیدا نشد");
  var admins=db.users.filter(function(x){return x.role==="admin"&&x.active&&x.id!==id}).length;
  if((o.role!==u.role||o.active===false)&&u.role==="admin"&&admins===0)throw new Error("باید حداقل یک مدیر فعال باقی بماند");
  return atomic(function(){if(o.name)u.name=String(o.name).trim();if(o.role)u.role=o.role;if(o.active!==undefined)u.active=!!o.active;
    if(o.pw){if(String(o.pw).length<4)throw new Error("رمز حداقل ۴ کاراکتر باشد");u.salt=uid();u.hash=hashPw(String(o.pw),u.salt)}
    touch();audit("update","user",id,"ویرایش کاربر "+u.name);return u})}
function checkLogin(username,pw){
  var un=String(username||"").trim().toLowerCase();
  var u=db.users.filter(function(x){return x.username===un&&x.active})[0];
  return u&&u.hash===hashPw(String(pw||""),u.salt)?u:null}
function adminAuth(username,pw){var u=checkLogin(username,pw);return u&&u.role==="admin"?u:null}

/* ---------- CSV ---------- */
function parseCSV(text){
  text=String(text||"").replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"",delim=[",",";","\t"].map(function(d){return[d,first.split(d).length]}).sort(function(a,b){return b[1]-a[1]})[0][0];
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<text.length;i++){var ch=text.charAt(i);
    if(q){if(ch==='"'){if(text.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f=""}
    else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(ch==="\r"){}
    else f+=ch}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(v){return String(v).trim()!==""})})}
function csvEsc(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
function toCSV(cols,rows){return "﻿"+[cols].concat(rows).map(function(r){return r.map(csvEsc).join(",")}).join("\r\n")}
/* ورود مشتریان: ستون‌ها = نام، تلفن، آدرس، مانده افتتاحیه (به واحد انتخابی) */
function importCustomers(rows){
  if(!rows.length)throw new Error("فایل خالی است");
  var h=rows[0].map(function(x){return String(x).trim()}),hasHead=/نام|name/i.test(h.join(" "));
  var idx={name:0,phone:1,address:2,opening:3};
  if(hasHead){h.forEach(function(t,i){if(/نام|name/i.test(t))idx.name=i;else if(/تلفن|موبایل|phone|mobile/i.test(t))idx.phone=i;else if(/آدرس|address/i.test(t))idx.address=i;else if(/مانده|بدهی|افتتاحیه|opening|balance|debt/i.test(t))idx.opening=i})}
  var data=hasHead?rows.slice(1):rows,added=0,skipped=0,dups=0;
  atomic(function(){data.forEach(function(r){var name=String(r[idx.name]||"").trim();if(!name){skipped++;return}
    var phone=String(r[idx.phone]||"").trim();if(findDup(name,phone)){dups++;return}
    var op=parseMoney(r[idx.opening]);
    var c={id:uid(),code:nextNo("cust","C",4),name:name,phone:phone,phone2:"",address:String(r[idx.address]||"").trim(),avatar:"",created:Date.now(),limit:0,note:"",status:"active"};
    db.customers.push(c);touch();if(op>0)_mkTx({cid:c.id,ts:Date.now(),type:"opening",debit:op,credit:0,desc:"مانده افتتاحیه (ورود از فایل)"});added++});

function bucketSeries(kind){
  var now=Date.now(),L=[],S=[],P=[],n=kind==="d"?14:kind==="w"?12:12,i,idx;
  for(i=0;i<n;i++){S.push(0);P.push(0)}
  var np=jp(now),nm=np.y*12+np.m-1,nd=dayNum(now),nw=weekIdx(now);
  function pos(ts){
    if(kind==="d")return n-1-(nd-dayNum(ts));
    if(kind==="w")return n-1-(nw-weekIdx(ts));
    var p=jp(ts);return n-1-(nm-(p.y*12+p.m-1))}
  for(i=0;i<n;i++){var back=n-1-i;
    if(kind==="d"){var p=jp(now-back*864e5);L.push(toFa(p.m+"/"+p.d))}
    else if(kind==="w"){var wd=((nd-2)%7+7)%7,ts=now-(wd+back*7)*864e5,q=jp(ts);L.push(toFa(q.m+"/"+q.d))}
    else{var mm=nm-back;L.push(JM[((mm%12)+12)%12])}}
  var paidAt={};db.payments.forEach(function(p){if(p.atSale&&p.status==="active")paidAt[p.atSale]=(paidAt[p.atSale]||0)+p.amount});
  db.txs.forEach(function(t){if(t.status!=="active")return;idx=pos(t.ts);if(idx<0||idx>=n)return;
    if(t.type==="sale")S[idx]+=t.debit;else if(t.type==="payment")P[idx]+=t.credit});
  return{labels:L,sales:S,pays:P}}
function debtTrend(days){
  var now=Date.now(),nd=dayNum(now),txs=db.txs.slice().sort(function(a,b){return a.ts-b.ts}),bal={},pos=0,k=0,out=[],lab=[];
  for(var i=days-1;i>=0;i--){var end=nd-i;
    while(k<txs.length&&dayNum(txs[k].ts)<=end){var t=txs[k++],b=bal[t.cid]||0,b2=b+t.debit-t.credit;pos+=Math.max(b2,0)-Math.max(b,0);bal[t.cid]=b2}
    out.push(pos);var p=jp(now-i*864e5);lab.push(toFa(p.m+"/"+p.d))}
  return{labels:lab,vals:out}}

   '<div class="grid g2" style="align-items:start"><div class="card"><h3>اطلاعات مغازه</h3><div class="f"><label>نام فروشگاه</label><input id="stShop" value="'+esc(s.shop)+'"></div><div class="fg"><div class="f"><label>تلفن</label><input id="stPh" value="'+esc(s.phone)+'"></div><div class="f"><label>واحد پول (در کل برنامه)</label><select id="stCur"><option value="toman"'+(s.cur==="toman"?" selected":"")+'>تومان</option><option value="rial"'+(s.cur==="rial"?" selected":"")+'>ریال</option></select></div></div><div class="f"><label>آدرس</label><input id="stAd" value="'+esc(s.address)+'"></div><div class="f"><label>لوگو (برای چاپ)</label><div class="row"><div id="stLg">'+(LOGO?'<img src="'+LOGO+'" style="max-height:48px">':'<span class="mute sm">ندارد</span>')+'</div><label class="btn sec s" style="cursor:pointer">انتخاب تصویر<input type="file" id="stLogo" accept="image/*" class="hide"></label><button class="btn sec xs" id="stNoLg">حذف</button></div></div><div class="f"><label>منطقه‌ی زمانی</label><select id="stTz">'+TZS.map(function(z){return '<option value="'+z[0]+'"'+(s.tz===z[0]?" selected":"")+'>'+z[1]+'</option>'}).join("")+'</select></div><div class="f"><label>متن پایین فاکتور و صورت‌حساب (قالب چاپ)</label><input id="stFt" value="'+esc(s.footer)+'"></div></div>'+
   '<div class="card"><h3>معیارها و هشدارها</h3><div class="fg"><div class="f"><label>مشتری پرریسک: بدهی بیش از ('+cuName()+')</label>'+mIn("stRD",s.riskDebt)+'</div><div class="f"><label>یا تأخیر بیش از (روز)</label><input id="stRDays" inputmode="numeric" value="'+toFa(s.riskDays)+'"></div></div><div class="fg"><div class="f"><label>هشدار نزدیک سقف اعتبار (درصد)</label><input id="stNP" inputmode="numeric" value="'+toFa(s.nearPct)+'"></div><div class="f"><label>سررسید نزدیک (روز مانده)</label><input id="stND" inputmode="numeric" value="'+toFa(s.nearDays)+'"></div></div><div class="f"><label>متن یادآوری پرداخت — متغیرها: {name} {amount} {cur} {shop} {due}</label><textarea id="stRm" rows="5">'+esc(s.remind)+'</textarea></div></div></div>'+
   '<button class="btn" id="stSave">'+ic("check")+' ذخیره‌ی تنظیمات</button>';
  $("page").innerHTML=h;
  $("stLogo").onchange=function(){if(this.files[0])resizeImg(this.files[0],function(d){LOGO=d;$("stLg").innerHTML='<img src="'+d+'" style="max-height:48px">'})};
  $("stNoLg").onclick=function(){LOGO="";$("stLg").innerHTML='<span class="mute sm">ندارد</span>'};
  $("stSave").onclick=function(){
    var oldCur=s.cur;s.shop=$("stShop").value.trim();s.phone=$("stPh").value.trim();s.address=$("stAd").value.trim();s.logo=LOGO;s.cur=$("stCur").value;s.tz=$("stTz").value;s.footer=$("stFt").value;
    s.noPass=$("stNoPass").checked;
    localStorage.setItem("dh_no_pass", s.noPass ? "true" : "false");
    localStorage.setItem("anbariyar_no_pass", s.noPass ? "true" : "false");
    s.riskDebt=toBase(num($("stRD").value));s.riskDays=Math.max(1,Math.round(num($("stRDays").value))||30);s.nearPct=Math.min(100,Math.max(1,Math.round(num($("stNP").value))||80));s.nearDays=Math.max(0,Math.round(num($("stND").value)));s.remind=$("stRm").value||defaults().settings.remind;
    setTz(s.tz);audit("settings","settings","","تغییر تنظیمات"+(oldCur!==s.cur?" (واحد پول: "+cuName()+")":""));
    if(!save())toast("ذخیره نشد","err");else{buildShell();ok("تنظیمات ذخیره شد");rerender()}}}};

/* ---------- شروع برنامه و حفاظت از دکمه برگشت گوشی ---------- */
function initHardwareBackButtonProtection() {
  history.pushState({ page: 'daftar' }, '', location.href);
  window.addEventListener('popstate', function() {
    // 1. بستن مودال در صورت باز بودن
    var m = $("modal");
    if (m && !m.classList.contains("hide") && m.style.display !== "none") {
      closeModal();
      history.pushState({ page: 'daftar' }, '', location.href);
      return;
    }
    // 2. اگر در زیرصفحه‌ایم، بازگشت به داشبورد
    if (location.hash && location.hash !== "#/" && location.hash !== "#/dashboard") {
      go("dashboard");
      history.pushState({ page: 'daftar' }, '', location.href);
      return;
    }
    // 3. در داشبورد: جلوگیری از خروج ناگهانی
    var now = Date.now();
    if (window._lastDaftarBack && now - window._lastDaftarBack < 2000) {
      return;
    }
    window._lastDaftarBack = now;
    history.pushState({ page: 'daftar' }, '', location.href);
    toast("برای خروج از برنامه، دوباره دکمه برگشت را بزنید", "info");
  });
}

(function boot(){
  try{if(localStorage.getItem("dh_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}
  load();
  initHardwareBackButtonProtection();

  // بررسی وضعیت عدم نیاز به رمز عبور (ورود مستقیم)
  var noPass = (db.settings && db.settings.noPass) || localStorage.getItem("dh_no_pass") === "true" || localStorage.getItem("anbariyar_no_pass") === "true";
  if (noPass) {
    if (!db.users.length) {
      var salt = uid();
      var usr = { id: uid(), name: "مدیر فروشگاه", username: "admin", salt: salt, hash: hashPw("1234", salt), role: "admin", active: true, created: Date.now() };
      db.users.push(usr);
      save();
    }
    cur = db.users.find(function(x){ return x.role === "admin" && x.active; }) || db.users[0];
    localStorage.setItem("dh_rem", cur.id);
    $("login").classList.add("hide");
    $("shell").classList.remove("hide");
    buildShell();
    if(!location.hash||location.hash==="#/")location.hash="#/dashboard";
    route();
  } else {
    var uid_=null;try{uid_=sessionStorage.getItem("dh_sess")||localStorage.getItem("dh_rem")}catch(e){}
    var u=uid_&&db.users.filter(function(x){return x.id===uid_&&x.active})[0];
    if(u){cur=u;$("login").classList.add("hide");$("shell").classList.remove("hide");buildShell();if(!location.hash||location.hash==="#/")location.hash="#/dashboard";route()}
    else showLogin();
  }

  // همگام‌سازی فوری هنگام فوکوس یا برگشت به تب
  function syncOnVisible(){
    try {
      var raw = localStorage.getItem(DBKEY);
      if (raw) {
        db = JSON.parse(raw);
        ensure();
        setTz(db.settings.tz);
        touch();
        if (cur) {
          cur = db.users.filter(function(x){return x.id===cur.id})[0] || cur;
          rerender();
        }
      }
    } catch(e){}
  }
  window.addEventListener("focus", syncOnVisible);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) syncOnVisible(); });

  /* اگر در تب دیگری اطلاعات تغییر کرد، همین‌جا هم به‌روز می‌شود تا چیزی بازنویسی نشود */
  window.addEventListener("storage",function(e){if(e.key===DBKEY&&e.newValue){try{db=JSON.parse(e.newValue);ensure();setTz(db.settings.tz);touch();if(cur&&!db.users.some(function(x){return x.id===cur.id&&x.active})){logout();return}if(cur){cur=db.users.filter(function(x){return x.id===cur.id})[0];rerender()}}catch(x){}}});
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw-daftar.js').catch(function(err){console.log('SW registration:',err)});
  }
})();

})();
</script>
