<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="p-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="url(#p-grad)" opacity="0.12" />

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="240" r="170" fill="#1e293b" stroke="#334155" stroke-width="4" />

  <!-- Shopping Cart Base -->
  <path d="M160 170 h42 l26 95 h118 l22 -75 h-150" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wheels -->
  <circle cx="236" cy="300" r="16" fill="#6366f1" stroke="#cbd5e1" stroke-width="4" />
  <circle cx="316" cy="300" r="16" fill="#ec4899" stroke="#cbd5e1" stroke-width="4" />

  <!-- Barcode inside Cart -->
  <g transform="translate(200, 195)">
    <rect x="0" y="0" width="8" height="50" fill="#a5b4fc" rx="3" />
    <rect x="14" y="0" width="14" height="50" fill="#a5b4fc" rx="3" />
    <rect x="34" y="0" width="6" height="50" fill="#a5b4fc" rx="3" />
    <rect x="46" y="0" width="12" height="50" fill="#a5b4fc" rx="3" />
    <rect x="64" y="0" width="18" height="50" fill="#a5b4fc" rx="3" />
    <rect x="88" y="0" width="8" height="50" fill="#a5b4fc" rx="3" />
    <rect x="102" y="0" width="10" height="50" fill="#a5b4fc" rx="3" />
  </g>

  <!-- Laser Scanner Line -->
  <line x1="150" y1="220" x2="362" y2="220" stroke="#ef4444" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <line x1="150" y1="220" x2="362" y2="220" stroke="#ff8080" stroke-width="2" stroke-linecap="round" />

  <!-- Title Badge below -->
  <rect x="140" y="375" width="232" height="56" rx="28" fill="url(#p-grad)" />
  <text x="256" y="412" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">انباریار PWA</text>
</svg>
